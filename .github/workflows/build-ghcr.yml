name: Build base image to GHCR

on:
  workflow_dispatch:
    inputs:
      comfyui_version:
        description: "ComfyUI version to install (needs >= 0.36.0 for YuE2 nodes)"
        required: true
        default: "0.38.1"
        type: string
  push:
    branches:
      - comfy-0.38.1
    paths:
      - ".github/workflows/build-ghcr.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base stage
        uses: docker/build-push-action@v6
        with:
          context: .
          target: base
          platforms: linux/amd64
          push: true
          build-args: |
            COMFYUI_VERSION=${{ inputs.comfyui_version || '0.38.1' }}
          tags: |
            ghcr.io/niqiukun/worker-comfyui:latest
            ghcr.io/niqiukun/worker-comfyui:comfy${{ inputs.comfyui_version || '0.38.1' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
